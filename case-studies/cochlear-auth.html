<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cochlear CoPilot — Carrie Francis-Miller</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: #1A1A17;
      color: #F3F3F1;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Back link ── */
    .auth-back {
      position: fixed;
      top: 1.75rem;
      left: 2rem;
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #F3F3F1;
      text-decoration: none;
      transition: color 150ms ease;
    }
    .auth-back:hover { color: rgba(243, 243, 241, 0.70); }

    /* ── Form container ── */
    .auth-wrap {
      width: min(190px, 80vw);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .auth-label {
      font-size: 0.8125rem;
      letter-spacing: 0.05em;
      color: #F3F3F1;
    }

    /* ── Input row — input + button share one bottom border ── */
    .auth-input-row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(243, 243, 241, 0.20);
      transition: border-color 150ms ease;
    }
    .auth-input-row:focus-within {
      border-bottom-color: rgba(243, 243, 241, 0.65);
    }

    .auth-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: #F3F3F1;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      padding: 0.5rem 0 0.6rem;
      outline: none;
    }
    .auth-input::placeholder {
      color: rgba(243, 243, 241, 0.25);
    }

    .auth-submit {
      background: none;
      border: none;
      color: #F3F3F1;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 0 0 0.1rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: color 150ms ease, opacity 200ms ease;
      flex-shrink: 0;
    }
    .auth-submit.is-ready {
      opacity: 1;
      pointer-events: auto;
    }
    .auth-submit:hover { color: rgba(243, 243, 241, 0.70); }

    .auth-error {
      font-size: 0.8125rem;
      letter-spacing: 0.05em;
      color: rgba(243, 243, 241, 0.35);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .auth-error.is-visible { opacity: 1; }
  </style>
</head>
<body>

  <a href="../index.html" class="auth-back">← Back</a>

  <div class="auth-wrap">
    <p class="auth-label">Magic words, please</p>

    <div class="auth-input-row">
      <input
        id="pwInput"
        class="auth-input"
        type="password"
        placeholder="password"
        autocomplete="off"
        spellcheck="false"
        autofocus
      >
      <button class="auth-submit" id="submitBtn">Go →</button>
    </div>

    <span class="auth-error" id="authError">incorrect password</span>
  </div>

  <script>
    (function () {
      var PASSWORD = 'canipetthatdog';
      var DEST     = new URLSearchParams(window.location.search).get('dest') === 'deck' ? 'cochlear-deck.html' : 'cochlear-copilot.html';

      var input = document.getElementById('pwInput');
      var btn   = document.getElementById('submitBtn');
      var error = document.getElementById('authError');

      function attempt() {
        if (input.value.trim() === PASSWORD) {
          sessionStorage.setItem('cc_auth', '1');
          sessionStorage.setItem('portfolio_auth', '1');
          window.location.replace(DEST);
        } else {
          error.classList.add('is-visible');
          input.value = '';
          input.focus();
        }
      }

      input.addEventListener('input', function () {
        btn.classList.toggle('is-ready', input.value.length >= PASSWORD.length);
      });

      /* Back link — use history.back() so browser restores scroll position */
      var backLink = document.querySelector('.auth-back');
      if (backLink) {
        backLink.addEventListener('click', function (e) {
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });
      }

      btn.addEventListener('click', attempt);

      input.addEventListener('keydown', function (e) {
        if (error.classList.contains('is-visible')) {
          error.classList.remove('is-visible');
        }
        if (e.key === 'Enter') attempt();
      });
    })();
  </script>

</body>
</html>
